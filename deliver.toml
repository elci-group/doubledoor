[[command]]
name = "cargo fmt --check"
cmd = ["cargo", "fmt", "--check"]
expect_exit = 0
timeout_secs = 120

[[command]]
name = "cargo clippy"
cmd = ["cargo", "clippy", "--all-targets", "--all-features"]
expect_exit = 0
timeout_secs = 300

[[command]]
name = "cargo test --workspace"
cmd = ["cargo", "test", "--workspace"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

[[command]]
name = "cargo doc"
cmd = ["cargo", "doc", "--no-deps", "--workspace"]
expect_exit = 0
timeout_secs = 300

[[command]]
name = "doubledoor --help"
cmd = ["cargo", "run", "-q", "-p", "doubledoor-cli", "--", "--help"]
expect_exit = 0
stdout_contains = ["EXIT CODES"]

[[command]]
name = "doubledoor --help lists Phase II commands"
cmd = ["cargo", "run", "-q", "-p", "doubledoor-cli", "--", "--help"]
expect_exit = 0
stdout_contains = ["watch", "events", "ghosts", "accept", "defer", "reject"]

[[command]]
name = "Phase II exit criterion"
cmd = ["cargo", "test", "-q", "-p", "doubledoor-cli", "--test", "ghosts"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

[[command]]
name = "Phase III exit criterion"
cmd = ["cargo", "test", "-q", "-p", "doubledoor-cli", "--test", "semantic"]
expect_exit = 0
timeout_secs = 300
stdout_contains = ["test result: ok"]

[[command]]
name = "doubledoor --help lists Phase III commands"
cmd = ["cargo", "run", "-q", "-p", "doubledoor-cli", "--", "--help"]
expect_exit = 0
stdout_contains = ["surfaces"]

[[command]]
name = "Phase IV exit criterion"
cmd = ["cargo", "test", "-q", "-p", "doubledoor-cli", "--test", "reconcile"]
expect_exit = 0
timeout_secs = 600
stdout_contains = ["test result: ok"]

[[command]]
name = "doubledoor --help lists Phase IV commands"
cmd = ["cargo", "run", "-q", "-p", "doubledoor-cli", "--", "--help"]
expect_exit = 0
stdout_contains = ["reconcile", "validate", "promote", "candidate", "discard"]

[[command]]
name = "Phase V exit criterion"
cmd = ["cargo", "test", "-q", "-p", "doubledoor-cli", "--test", "evidence"]
expect_exit = 0
timeout_secs = 900
stdout_contains = ["test result: ok"]

[[command]]
